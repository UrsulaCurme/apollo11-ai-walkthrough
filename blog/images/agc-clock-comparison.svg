<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .bar-label { font-size: 12px; fill: #333; text-anchor: middle; }
      .bar-value { font-size: 13px; fill: #fff; text-anchor: middle; font-weight: bold; }
      .bar-value-dark { font-size: 13px; fill: #333; text-anchor: middle; font-weight: bold; }
      .axis-label { font-size: 11px; fill: #666; text-anchor: end; }
      .chart-title { font-size: 16px; fill: #1a1a2e; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="32" class="chart-title">Clock Speed (MHz) — AGC vs. Everyday Devices</text>

  <!-- Y-axis gridlines and labels -->
  <line x1="100" y1="55" x2="680" y2="55" stroke="#e8e8e8" stroke-width="1"/>
  <text x="92" y="59" class="axis-label">50</text>
  <line x1="100" y1="100" x2="680" y2="100" stroke="#e8e8e8" stroke-width="1"/>
  <text x="92" y="104" class="axis-label">40</text>
  <line x1="100" y1="145" x2="680" y2="145" stroke="#e8e8e8" stroke-width="1"/>
  <text x="92" y="149" class="axis-label">30</text>
  <line x1="100" y1="190" x2="680" y2="190" stroke="#e8e8e8" stroke-width="1"/>
  <text x="92" y="194" class="axis-label">20</text>
  <line x1="100" y1="235" x2="680" y2="235" stroke="#e8e8e8" stroke-width="1"/>
  <text x="92" y="239" class="axis-label">10</text>
  <!-- Baseline -->
  <line x1="100" y1="280" x2="680" y2="280" stroke="#aaa" stroke-width="1.5"/>
  <text x="92" y="284" class="axis-label">0</text>
  <text x="40" y="170" class="axis-label" text-anchor="middle" transform="rotate(-90, 40, 170)" font-size="12" fill="#555">MHz</text>

  <!-- Bar 1: AGC (1.024 MHz) - barely visible, needs special treatment -->
  <rect x="120" y="275.4" width="80" height="4.6" rx="3" fill="#c0392b"/>
  <text x="160" y="270" class="bar-value-dark">1.0</text>
  <text x="160" y="300" class="bar-label">AGC</text>
  <text x="160" y="313" class="bar-label" font-size="10" fill="#999">(1966)</text>

  <!-- Bar 2: Apple II (1 MHz) -->
  <rect x="230" y="275.5" width="80" height="4.5" rx="3" fill="#e67e22"/>
  <text x="270" y="270" class="bar-value-dark">1.0</text>
  <text x="270" y="300" class="bar-label">Apple II</text>
  <text x="270" y="313" class="bar-label" font-size="10" fill="#999">(1977)</text>

  <!-- Bar 3: Arduino Uno (16 MHz) -->
  <rect x="340" y="208" width="80" height="72" rx="3" fill="#2980b9"/>
  <text x="380" y="250" class="bar-value">16</text>
  <text x="380" y="300" class="bar-label">Arduino Uno</text>
  <text x="380" y="313" class="bar-label" font-size="10" fill="#999">(2010)</text>

  <!-- Bar 4: Smartcard ARM (30 MHz) -->
  <rect x="450" y="145" width="80" height="135" rx="3" fill="#27ae60"/>
  <text x="490" y="220" class="bar-value">30</text>
  <text x="490" y="300" class="bar-label">Smartcard</text>
  <text x="490" y="313" class="bar-label" font-size="10" fill="#999">ARM SC300</text>

  <!-- Bar 5: Washing Machine MCU (48 MHz) -->
  <rect x="560" y="64" width="80" height="216" rx="3" fill="#8e44ad"/>
  <text x="600" y="180" class="bar-value">48</text>
  <text x="600" y="300" class="bar-label">Washing</text>
  <text x="600" y="313" class="bar-label" font-size="10" fill="#999">Machine MCU</text>

  <!-- Copyright -->
  <text x="690" y="335" text-anchor="end" font-size="9" fill="#999">© Julien Simon, 2026 — www.airealist.ai</text>
</svg>